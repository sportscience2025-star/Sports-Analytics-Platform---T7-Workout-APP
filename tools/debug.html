<!DOCTYPE html>
<html>
<head>
<script>
window.onerror = function(msg, url, line, col, error) {
    var errObj = {msg: msg, url: url, line: line, col: col, stack: error ? error.stack : null};
    fetch('/log', {
        method: 'POST',
        body: JSON.stringify(errObj),
        headers: {'Content-Type': 'application/json'}
    });
};
</script>
</head>
<body>
    <!-- External Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dayjs@1/dayjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.8.0/math.js"></script>

    <!-- Scripts -->
    <script src="js/data.js"></script>
    <script src="js/media.js"></script>
    <script src="js/impact-calculator.js"></script>
    <script src="js/clinical.js"></script>
    <script src="js/physics-engine.js"></script>
    <script src="js/parser.js"></script>
    <script src="js/knowledge-base.js"></script>
    <script src="js/logic.js"></script>
    <script src="js/data-analysis.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>
    <script>
        fetch('/log', {
            method: 'POST',
            body: JSON.stringify({msg: "LOADED_OK"}),
            headers: {'Content-Type': 'application/json'}
        });
    </script>
</body>
</html>
