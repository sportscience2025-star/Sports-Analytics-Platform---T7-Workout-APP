    <header class="app-header">
        <div class="logo">
            <h1>T7 <span class="highlight">Workout</span></h1>
        </div>
        <nav class="main-nav">
            <a href="#" class="nav-item" data-view="catalog">Catalogo</a>

            <a href="#" class="nav-item" data-view="analysis">Data Analisi</a>

    <main id="app-container" class="app-container">
        <!-- Content will be injected here by JS -->
        <div class="loading-state" style="display:flex;align-items:center;justify-content:center;height:60vh;flex-direction:column;gap:1rem">
            <div style="width:40px;height:40px;border:3px solid rgba(99,102,241,0.2);border-top-color:var(--primary,#6366f1);border-radius:50%;animation:spin 0.8s linear infinite"></div>
            <p style="color:#94a3b8;font-size:0.9rem;margin:0">Caricamento T7 Workout...</p>
        </div>
    </main>

    <!-- Modal Container -->
    <div id="modal-backdrop" class="modal-backdrop hidden">
        <div id="modal-content" class="modal-content">
            <button id="modal-close" class="modal-close">&times;</button>
            <div id="modal-body"></div>
        </div>
    </div>

    <!-- Bottom Navigation (Mobile) -->
    <nav class="bottom-nav" id="bottom-nav">
        <button class="bottom-nav-item active" data-view="catalog">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="7" height="7"/>
                <rect x="14" y="3" width="7" height="7"/>
                <rect x="3" y="14" width="7" height="7"/>
                <rect x="14" y="14" width="7" height="7"/>
            </svg>
            <span>Catalogo</span>
        </button>
        <button class="bottom-nav-item" data-view="wizard">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
            </svg>
            <span>Programma</span>
        </button>
        <button class="bottom-nav-item" data-view="analysis">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="20" x2="18" y2="10"/>
                <line x1="12" y1="20" x2="12" y2="4"/>
                <line x1="6" y1="20" x2="6" y2="14"/>
            </svg>
            <span>Analisi</span>
        </button>
        <button class="bottom-nav-item" data-view="scientific_hub">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
                <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
            </svg>
            <span>Libreria</span>
        </button>
        <button class="bottom-nav-item" data-view="rag">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <ellipse cx="12" cy="5" rx="9" ry="3"/>
                <path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/>
                <path d="M3 12c0 1.66 4 3 9 3s9-1.34 9-3"/>
            </svg>
            <span>RAG</span>
        </button>
        <button class="bottom-nav-item" data-view="favorites">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
            </svg>
            <span>Preferiti</span>
        </button>
