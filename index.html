    <meta name="theme-color" content="#080c16">
    <meta name="description" content="T7 Workout – Il tuo assistente di allenamento intelligente. Crea programmi personalizzati con supporto clinico.">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="T7 Workout">
    <meta name="mobile-web-app-capable" content="yes">

    <title>T7 Workout</title>

    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">

    <!-- Icons -->
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/icon-180.png">

    <link rel="stylesheet" href="css/style.css">

    <!-- Google Fonts: Inter & Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- Defensive Dark Cockpit Base -->
    <style>
        html, body {
            background-color: #0b0e14;
            color: #f1f5f9;
            min-height: 100vh;
            margin: 0;
            padding: 0;
        }
    </style>
</head>

<body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Service Worker Registration & Localhost Defensive Cache Cleaner -->
    <script>
        const isLocalDev = Boolean(
            window.location.hostname === 'localhost' ||
            window.location.hostname === '[::1]' ||
            window.location.hostname.match(/^127(?:\.(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)){3}$/)
        );

        if (isLocalDev && 'serviceWorker' in navigator) {
            // In sviluppo locale, deregistra SW esistenti e pulisce le vecchie cache stantìe
            navigator.serviceWorker.getRegistrations().then(registrations => {
                for (const reg of registrations) {
                    reg.unregister().then(unregistered => {
                        if (unregistered) console.log('[T7 Dev] SW deregistrato su localhost:', reg.scope);
                    });
                }
            });
            if ('caches' in window) {
                caches.keys().then(keys => {
                    keys.forEach(key => {
                        if (key !== 't7-workout-v120') {
                            caches.delete(key);
                        }
                    });
                });
            }
        } else if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('[App] SW registered:', reg.scope))
                    .catch(err => console.warn('[App] SW registration failed:', err));
            });
        }
    </script>
</body>

</html>
